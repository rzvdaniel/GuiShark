<!doctype html><html><head><link rel="stylesheet" href="styles.css"></head><body class="modal">
<main class="pause-card">
    <div class="card-content">
    <div class="card-heading"><img class="relic" src="art/lantern-relic.png"><div class="title-group"><span class="eyebrow">BENEATH THE LEAVES</span><h1>A quiet moment.</h1></div></div>
    <p class="lead">Your balloon is waiting, just where you left it.</p><div class="rule"></div>
    <button id="resume" class="primary"><span class="button-label">Keep drifting</span><img class="button-leaf leaf-left" src="art/woodland-leaf.png"><img class="button-leaf leaf-right" src="art/woodland-leaf.png"></button>
    <button id="restart"><span class="button-label">Start a fresh expedition</span><img class="button-leaf leaf-left" src="art/woodland-leaf.png"><img class="button-leaf leaf-right" src="art/woodland-leaf.png"></button>
    <button id="menu" class="quiet"><span class="button-label">Return to the main menu</span><img class="button-leaf leaf-left" src="art/woodland-leaf.png"><img class="button-leaf leaf-right" src="art/woodland-leaf.png"></button>
    <span class="fine-print">Esc to resume / Tab to explore</span>
</div>
    <img class="frame-corner top-left" src="art/woodland-corner.png">
    <img class="frame-corner top-right" src="art/woodland-corner.png">
    <img class="frame-corner bottom-left" src="art/woodland-corner.png">
    <img class="frame-corner bottom-right" src="art/woodland-corner.png">
</main></body></html>
