<!doctype html><html><head><link rel="stylesheet" href="host.css"></head><body>
<header><h1>GuiShark Threaded Studio</h1><p>One OpenGL host. One independently rendered application.</p></header>
<main>
<div class="toolbar"><button id="freeze">Freeze app for 5 seconds</button><button id="error">Throw handled app error</button><span id="host-status">Host running</span></div>
<div id="viewport"></div>
<div class="footer"><span id="worker-status">Starting application...</span><span id="frames">Host frames: 0</span></div>
</main>
<p class="hint">Click the button inside the blue app. The host controls stay active while the app is frozen.</p>
</body></html>
