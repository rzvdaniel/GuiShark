name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Verify solution coverage
        run: ./eng/Verify-SolutionCoverage.ps1
      - name: Build complete solution (Debug)
        run: dotnet build Gui.Shark.sln -c Debug --no-incremental -v minimal
      - name: Build complete solution (Release)
        run: dotnet build Gui.Shark.sln -c Release --no-incremental -v minimal
      - name: Run regression tests (Debug)
        run: dotnet test --solution Gui.Shark.sln -c Debug --no-build --no-restore
      - name: Run regression tests (Release)
        run: dotnet test --solution Gui.Shark.sln -c Release --no-build --no-restore
